			const deleteTask = taskId => { const deletedTask = stages.flatMap(stage => stage.tasks).find(task => task.id === taskId); setStages(current => current.map(stage => ({ ...stage, tasks: stage.tasks.filter(task => task.id !== taskId) }))); if (deletedTask) recordActivity('Atividade excluída: ' + deletedTask.title, '×'); };
			const moveTask = (taskId, nextStageId, titleOverride, beforeTaskId = null) => { let movedTask; let previousStage; const withoutTask = stages.map(stage => ({ ...stage, tasks: stage.tasks.filter(task => { if (task.id === taskId) { movedTask = { ...task, ...(titleOverride && { title: titleOverride.trim() }) }; previousStage = stage; } return task.id !== taskId; }) })); if (!movedTask) return; setStages(withoutTask.map(stage => { if (stage.id !== nextStageId) return stage; const insertionIndex = beforeTaskId ? stage.tasks.findIndex(task => task.id === beforeTaskId) : -1; const tasks = [...stage.tasks]; tasks.splice(insertionIndex < 0 ? tasks.length : insertionIndex, 0, movedTask); return { ...stage, tasks }; })); setEditingId(null); const nextStage = stages.find(stage => stage.id === nextStageId); const changedColumn = previousStage && previousStage.id !== nextStageId; recordActivity(changedColumn ? movedTask.title + ' movida para ' + nextStage.name : movedTask.title + ' reordenada', changedColumn ? '↗' : '↕'); };
			const handleDragStart = (event, taskId) => { event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', taskId); setDraggedTaskId(taskId); };
			const handleDrop = (event, stageId, beforeTaskId = null) => { event.preventDefault(); event.stopPropagation(); const taskId = event.dataTransfer.getData('text/plain') || draggedTaskId; if (taskId) moveTask(taskId, stageId, null, beforeTaskId); setDraggedTaskId(null); setDropTargetId(null); setDropBeforeTaskId(null); };
			const addTask = stageId => { if (!newTitle.trim()) return; setStages(current => current.map(stage => stage.id === stageId ? { ...stage, tasks: [...stage.tasks, { id: stageId + '-' + Date.now(), title: newTitle.trim() }] } : stage)); setNewTitle(''); setAddingTo(null); const targetStage = stages.find(stage => stage.id === stageId); recordActivity('Nova atividade: ' + newTitle.trim(), '+', targetStage ? targetStage.name : 'Atividade criada'); };
			return <main className="shell">
				<nav className="topbar"><div className="brand"><span className="brand-mark">↗</span><span>Geração de ADS</span></div><span className="eyebrow" style={{margin: 0}}>Visão geral · {currentDate} {supabaseClient && <span className="sync-status">· {syncStatus}</span>}</span></nav>
				<section className="hero"><div><p className="eyebrow">Fluxo de entrega</p><h1>Da ideia ao conteúdo.</h1><p className="hero-copy">Um mapa vivo das entregas de produção, com o que já foi construído, os próximos movimentos e os pontos que precisam de atenção.</p></div><div className="hero-side"><div className="hero-side-head"><span>Progresso do fluxo</span><span>{doneTasks} de {totalTasks} itens</span></div><strong>{progress}%</strong><div className="progress-track" style={{marginTop: 14}}><div className="progress-fill" style={{width: progress + '%'}}></div></div><div className="progress-meta"><span>Início da operação</span><span>Próximo ciclo</span></div></div></section>
				<section className="kpis"><div className="kpi"><span className="kpi-label">Itens no fluxo</span><span className="kpi-value">{totalTasks}</span><span className="kpi-note">total</span></div><div className="kpi"><span className="kpi-label">Concluídos</span><span className="kpi-value">{doneTasks}</span><span className="kpi-note">{totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0}%</span></div><div className="kpi"><span className="kpi-label">Em andamento</span><span className="kpi-value">{stages.find(stage => stage.id === 'todo').tasks.length}</span><span className="kpi-note">prioridade</span></div><div className="kpi"><span className="kpi-label">Próximo passo</span><span className="kpi-value">{stages.find(stage => stage.id === 'next').tasks.length}</span><span className="kpi-note">entregas</span></div></section>
				<section><div className="section-heading"><div><h2>Mapa de entregas</h2><p>Arraste, edite, mova e crie tarefas diretamente no quadro.</p></div><div className="filters">{['Todos', 'Em seguida', 'Ativo', 'Concluído'].map(item => <button key={item} className={'filter ' + (filter === item ? 'active' : '')} onClick={() => setFilter(item)}>{item}</button>)}</div></div><div className="stages">{visibleStages.map(stage => <article className={'stage ' + stage.id + (dropTargetId === stage.id ? ' drop-target' : '')} key={stage.id} onDragOver={event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; setDropTargetId(stage.id); }} onDragLeave={event => { if (!event.currentTarget.contains(event.relatedTarget)) setDropTargetId(null); }} onDrop={event => handleDrop(event, stage.id)}><div className="stage-bar" style={{background: stage.color}}></div><div className="stage-body"><div className="stage-title"><h3>{stage.name}</h3><span className="count">{stage.tasks.length} {stage.tasks.length === 1 ? 'item' : 'itens'}</span></div><p>{stage.description}</p>{stage.tasks.length === 0 && <div className="empty-stage">Nenhuma tarefa nesta coluna.</div>}{stage.tasks.map(task => <div className={'task ' + (task.title.includes('garimpo') ? 'highlight' : '') + (draggedTaskId === task.id ? ' dragging' : '')} key={task.id} draggable="true" onDragStart={event => handleDragStart(event, task.id)} onDragEnd={() => { setDraggedTaskId(null); setDropTargetId(null); setDropBeforeTaskId(null); }} onDragOver={event => { event.preventDefault(); event.stopPropagation(); setDropTargetId(stage.id); setDropBeforeTaskId(task.id); }} onDrop={event => handleDrop(event, stage.id, task.id)}><span className="task-dot"></span>{editingId === task.id ? <div className="task-card"><div className="task-edit"><input className="task-input" value={draft} onChange={event => setDraft(event.target.value)} onKeyDown={event => event.key === 'Enter' && saveTask(task.id)} autoFocus /><button className="task-action" onClick={() => saveTask(task.id)}>Salvar</button></div><select className="task-select" value={stage.id} onChange={event => moveTask(task.id, event.target.value, draft)}>{stages.map(option => <option value={option.id} key={option.id}>{option.name}</option>)}</select></div> : <><span className="task-card">{task.title}</span><span className="task-actions"><button className="task-action" aria-label={'Editar ' + task.title} onClick={() => startEditing(task)}>Editar</button><button className="task-action" aria-label={'Excluir ' + task.title} onClick={() => deleteTask(task.id)}>Excluir</button></span></>}</div>)}{addingTo === stage.id ? <div className="add-form"><input className="add-input" placeholder="Nome da nova tarefa" value={newTitle} onChange={event => setNewTitle(event.target.value)} onKeyDown={event => event.key === 'Enter' && addTask(stage.id)} autoFocus /><button className="task-action" onClick={() => addTask(stage.id)}>Adicionar</button><button className="task-action" onClick={() => setAddingTo(null)}>Cancelar</button></div> : <button className="add-task" onClick={() => { setAddingTo(stage.id); setNewTitle(''); }}>＋ Adicionar tarefa</button>}</div></article>)}</div></section>
				<section className="details"><div className="panel"><h3>Saúde do fluxo</h3><div className="metric-row"><div className="metric-label"><span>Base operacional</span><span>100%</span></div><div className="progress-track"><div className="progress-fill"></div></div></div><div className="metric-row"><div className="metric-label"><span>Automação e scripts</span><span>67%</span></div><div className="progress-track"><div className="progress-fill"></div></div></div><div className="metric-row"><div className="metric-label"><span>Dados e acompanhamento</span><span>33%</span></div><div className="progress-track"><div className="progress-fill"></div></div></div></div><div className="panel"><h3>Últimas movimentações</h3>{activity.map(item => <div className="update" key={item.id}><span className="update-icon">{item.icon}</span><div><b>{item.title}</b><small>{item.detail}</small></div></div>)}</div></section>
				<p className="footer">Painel de acompanhamento da produção · histórico desta sessão</p>
			</main>;
		}
		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
</body>
</html>
